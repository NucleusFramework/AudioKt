name: Build Native Libraries

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            resource_dir: darwin-aarch64
            lib: libnucleus_rodio.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            resource_dir: darwin-x64
            lib: libnucleus_rodio.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            resource_dir: linux-x64
            lib: libnucleus_rodio.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            resource_dir: linux-aarch64
            lib: libnucleus_rodio.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            resource_dir: win32-x64
            lib: nucleus_rodio.dll
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            resource_dir: win32-aarch64
            lib: nucleus_rodio.dll
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build nucleus_rodio
        working-directory: rodio/src/main/native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage native into resources
        shell: bash
        run: |
          mkdir -p "rodio/src/main/resources/nucleus/native/${{ matrix.resource_dir }}"
          cp "rodio/src/main/native/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "rodio/src/main/resources/nucleus/native/${{ matrix.resource_dir }}/${{ matrix.lib }}"
          ls -lh "rodio/src/main/resources/nucleus/native/${{ matrix.resource_dir }}/${{ matrix.lib }}"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.resource_dir }}
          path: rodio/src/main/resources/nucleus/native/${{ matrix.resource_dir }}/${{ matrix.lib }}
          retention-days: 1