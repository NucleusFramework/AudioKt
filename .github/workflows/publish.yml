name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  build-natives:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/build-natives.yaml

  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION_NAME="${TAG#v}"
          sed -i.bak "s/^VERSION_NAME=.*/VERSION_NAME=$VERSION_NAME/" gradle.properties
          rm -f gradle.properties.bak
          # build.gradle.kts derives publishVersion from GITHUB_REF
          echo "GITHUB_REF=refs/tags/${TAG}" >> "$GITHUB_ENV"

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: natives

      - name: Stage natives into rodio resources
        run: |
          for dir in darwin-aarch64 darwin-x64 linux-x64 linux-aarch64 win32-x64 win32-aarch64; do
            mkdir -p "rodio/src/main/resources/nucleus/native/$dir"
            cp "natives/native-$dir/"* "rodio/src/main/resources/nucleus/native/$dir/" 2>/dev/null || true
          done
          echo "=== Staged natives ==="
          find rodio/src/main/resources/nucleus/native -type f -exec ls -lh {} \;

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Publish to Maven Central
        run: ./gradlew :rodio:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}